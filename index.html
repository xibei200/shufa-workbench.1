<title>书法课消管理工作台</title>
<style>
:root{
  --bg:#f5f2ec; --card:#fff; --line:#e9e2d7; --line2:#f1ece3;
  --ink:#2f2a26; --ink2:#6b6259; --ink3:#a1978c;
  --zhu:#a8352a; --zhu-soft:#f8e9e5;
  --green:#2e7d5b; --green-soft:#e5f1ea;
  --amber:#b8791f; --amber-soft:#f9eeda;
  --blue:#2f5d8a; --blue-soft:#e7eef6;
  --r:14px; --sh:0 1px 2px rgba(47,42,38,.05),0 4px 14px rgba(47,42,38,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55; padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 40px}
h1,h2,h3{margin:0}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
svg{display:block}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--zhu);display:flex;align-items:center;justify-content:center;flex:none}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.5px}
.brand p{margin:0;font-size:12px;color:var(--ink3)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:14px;font-weight:600}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--zhu);border-color:var(--zhu);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--zhu);border-color:#f0d5d0}
.btn.icon{min-height:38px;padding:0 10px}

/* ---------- notice ---------- */
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--amber-soft);border:1px solid #f0e0bd;
  color:#7a5410;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.notice button{margin-left:auto;flex:none;font-size:13px;font-weight:700;color:#7a5410;text-decoration:underline}

/* ---------- today ---------- */
.today{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px;margin-bottom:14px;border-left:4px solid var(--zhu)}
.today h2{font-size:16px;display:flex;align-items:center;gap:7px}
.today h2 span.date{font-size:12px;font-weight:500;color:var(--ink3);margin-left:auto}
.tlist{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;background:#faf8f4;border:1px solid var(--line2)}
.titem.od{background:var(--zhu-soft);border-color:#f1d7d1}
.titem .ic{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#efe9e0;color:var(--ink2)}
.titem.od .ic{background:#f3d6d0;color:var(--zhu)}
.titem .tx{flex:1;min-width:0;font-size:14px}
.titem .tx b{font-weight:600}
.titem .tx em{font-style:normal;color:var(--ink3);font-size:12px;display:block}
.titem.od .tx b{color:var(--zhu)}
.empty{padding:12px;text-align:center;color:var(--ink3);font-size:13px;background:#faf8f4;border-radius:11px;border:1px dashed var(--line)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:14px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:9px;
  font-size:14px;font-weight:600;color:var(--ink2)}
.tab.on{background:var(--zhu);color:#fff}
.tab svg{opacity:.9}
.seg{display:flex;gap:6px;background:#efe9e0;border-radius:10px;padding:4px}
.seg-btn{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink2);
  padding:9px 6px;border-radius:7px;cursor:pointer;min-height:44px}
.seg-btn.active{background:#fff;color:var(--zhu);box-shadow:0 1px 4px rgba(47,42,38,.12)}


/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card h3{font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.sub{font-size:12px;color:var(--ink3);margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink3);font-weight:600}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fdfcfa;outline:none}
.inp:focus{border-color:var(--zhu);background:#fff}
textarea.inp{min-height:70px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- student card ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sc{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fdfcfa}
.sc.low{border-color:#f1d7d1;background:var(--zhu-soft)}
.sc .nm{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.sc .nm .ava{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.sc .acts{margin-left:auto;display:flex;gap:6px}
.kv{display:flex;gap:8px;margin-top:10px}
.kv div{flex:1;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 9px;text-align:center}
.kv b{display:block;font-size:17px;font-weight:700}
.kv span{font-size:11px;color:var(--ink3)}
.kv .c{color:var(--zhu)} .kv .r{color:var(--green)}
.bar{height:8px;border-radius:99px;background:#efe9e0;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--zhu)}
.warn{margin-top:8px;font-size:12px;color:var(--zhu);font-weight:600}

/* ---------- list row ---------- */
.lrow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fdfcfa;margin-bottom:8px}
.lrow.dim{opacity:.55}
.lrow .who{flex:1;min-width:0}
.lrow .who b{font-size:15px}
.lrow .who em{font-style:normal;display:block;font-size:12px;color:var(--ink3)}
.seg{display:flex;gap:4px;background:#f2ede5;padding:3px;border-radius:10px;flex:none}
.seg button{min-height:34px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg button.on[data-v="present"]{color:var(--green)}
.seg button.on[data-v="leave"]{color:var(--amber)}
.seg button.on[data-v="absent"]{color:var(--ink2)}
.hin{width:74px;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;text-align:center;background:#fff;flex:none}
.rmk{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fdfcfa;font-size:14px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--zhu);border-color:var(--zhu);color:#fff}
.nametag{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid #d9e3ef;background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:600}
.nametag.on{background:var(--blue);border-color:var(--blue);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;flex:none}
.badge.present{background:var(--green-soft);color:var(--green)}
.badge.leave{background:var(--amber-soft);color:var(--amber)}
.badge.absent{background:#f0ece5;color:var(--ink2)}
.badge.none{background:#f0ece5;color:var(--ink3)}

/* ---------- detail table ---------- */
.dtl{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{color:var(--ink3);font-weight:600;font-size:12px}
td.num{color:var(--zhu);font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fdfcfa;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:var(--ink3)}
.chartbox{background:#fdfcfa;border:1px solid var(--line);border-radius:12px;padding:10px 6px 4px}
.foot{text-align:center;color:var(--ink3);font-size:12px;padding:8px 0 0}

/* ---------- mobile bottom nav ---------- */
@media (max-width:768px){
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .wrap{padding:12px 11px 30px}
  .brand h1{font-size:17px}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr);gap:7px}
  .stat b{font-size:17px}
  .lrow{flex-wrap:wrap}
  .lrow .who{flex:1 1 100%}
  .seg{flex:1 1 auto}
  .seg button{flex:1;min-height:44px;padding:0 6px}
  .hin{width:66px;min-height:44px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;border-radius:0;border-left:none;border-right:none;
    border-bottom:none;margin:0;gap:1px;padding:5px 2px calc(5px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(47,42,38,.09)}
  .tab{flex-direction:column;gap:1px;font-size:9.5px;min-height:46px;padding:0 1px}
  .tab svg{width:18px;height:18px}
  .chip,.nametag{min-height:42px}
}
</style>

      <span>课表</span>

    <section id="tab-rollcall" data-page-node-id="MzzX7cdJHYwg11BWAtBL1Z"></section>

<script>
/* ============ 数据层 ============ */
var KEY = 'wb_calligraphy_v1';
var WD = ['一','二','三','四','五','六','日'];
var state = { students: [], lessons: {}, renewals: [], schedule: {}, curDate: '', tab: 'students',
  editId: '', openSid: '', kw: '', seeded: false, rptMonth: '', renewSid: '',
  schDay: 0, schSid: '', schForm: null, querySub: 'list' };

function uid(){ return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseYmd(s){ var p = String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayStr(){ return ymd(new Date()); }
function shift(str, n){ var d = parseYmd(str); d.setDate(d.getDate()+n); return ymd(d); }
function cnDate(str){ var p = String(str).split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; }
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(v){ var n = parseFloat(v); return (isNaN(n) || n < 0) ? null : n; }

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if (raw) {
    try {
      var d = JSON.parse(raw);
      state.students = Array.isArray(d.students) ? d.students : [];
      state.lessons = (d.lessons && typeof d.lessons === 'object') ? d.lessons : {};
      state.renewals = Array.isArray(d.renewals) ? d.renewals : [];
      state.schedule = (d.schedule && typeof d.schedule === 'object') ? d.schedule : {};
      state.seeded = !!d.seeded;
      return;
    } catch(e){ /* 数据损坏，走种子数据 */ }
  }
  seed();
  save();
}
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify({
      students: state.students, lessons: state.lessons, renewals: state.renewals,
      schedule: state.schedule, seeded: state.seeded, v: 3
    }));
  } catch(e){ alert('保存失败：浏览器存储可能已满或被禁用'); }
}

function seed(){
  var t = todayStr();
  var a = { id: uid(), name: '林知墨', total: 24, note: '楷书启蒙', created: shift(t,-20) };
  var b = { id: uid(), name: '陈砚青', total: 36, note: '行书进阶', created: shift(t,-18) };
  var c = { id: uid(), name: '苏小雨', total: 12, note: '硬笔入门', created: shift(t,-10) };
  var d = { id: uid(), name: '王一诺', total: 6,  note: '试听转正式', created: shift(t,-6) };
  state.students = [a,b,c,d];
  state.lessons = {};
  state.lessons[shift(t,-3)] = {
    date: shift(t,-3), remark: '第一节课：纠正握笔姿势，练横画',
    items: (function(){ var o={}; o[a.id]={status:'present',hours:2,remark:'握笔有进步'};
      o[b.id]={status:'present',hours:2,remark:''}; o[c.id]={status:'present',hours:1,remark:''};
      o[d.id]={status:'present',hours:1,remark:'第一次课'}; return o; })()
  };
  state.lessons[shift(t,-2)] = {
    date: shift(t,-2), remark: '临摹《九成宫》前两行',
    items: (function(){ var o={}; o[a.id]={status:'present',hours:2,remark:''};
      o[b.id]={status:'leave',hours:0,remark:'家长请假，已约补课'};
      o[c.id]={status:'present',hours:2,remark:'结构把握不错'};
      o[d.id]={status:'absent',hours:1,remark:'临时缺席，按约定扣课时'}; return o; })()
  };
  state.lessons[shift(t,-1)] = {
    date: shift(t,-1), remark: '',
    items: (function(){ var o={}; o[a.id]={status:'present',hours:null,remark:''};
      o[b.id]={status:'present',hours:2,remark:''}; o[c.id]={status:'present',hours:1,remark:''};
      o[d.id]={status:'present',hours:1,remark:'笔画顺序需加强'}; return o; })()
  };
  // 续费 / 课包记录：陈砚青的课包 12 天后到期（用于演示到期提醒）
  state.renewals = [
    { id: uid(), sid: b.id, date: shift(t,-40), hours: 12, amount: 1200, expire: shift(t,12),  note: '暑期续费 12 课时' },
    { id: uid(), sid: c.id, date: shift(t,-9),  hours: 10, amount: 980,  expire: shift(t,80),  note: '硬笔进阶包' },
    { id: uid(), sid: a.id, date: shift(t,-15), hours: 20, amount: 1900, expire: '',           note: '未设有效期' }
  ];
  // 每周排课：周三两节、周六一节
  state.schedule = {
    '3': [ { id: uid(), start: '09:00', end: '10:30', name: '楷书启蒙班', sids: [a.id, c.id] },
           { id: uid(), start: '14:00', end: '15:30', name: '行书进阶班', sids: [b.id, d.id] } ],
    '6': [ { id: uid(), start: '09:00', end: '11:00', name: '周末综合班', sids: [a.id, b.id, c.id] } ]
  };
  state.seeded = true;
}

/* ============ 计算层 ============ */
function getLesson(date){
  if (!state.lessons[date]) state.lessons[date] = { date: date, remark: '', items: {} };
  return state.lessons[date];
}
function getRec(date, sid){
  var L = state.lessons[date];
  if (L && L.items[sid]) return L.items[sid];
  return null;
}
function setRec(date, sid, patch){
  var L = getLesson(date);
  if (!L.items[sid]) L.items[sid] = { status: '', hours: null, remark: '' };
  for (var k in patch) L.items[sid][k] = patch[k];
  return L.items[sid];
}
function consumedOf(sid){
  var sum = 0;
  for (var d in state.lessons) {
    var it = state.lessons[d].items[sid];
    if (it && typeof it.hours === 'number') sum += it.hours;
  }
  return Math.round(sum * 100) / 100;
}
function renewalHoursOf(sid){
  var sum = 0;
  for (var i = 0; i < state.renewals.length; i++) {
    if (state.renewals[i].sid === sid) sum += (num(state.renewals[i].hours) || 0);
  }
  return Math.round(sum * 100) / 100;
}
function totalHoursOf(sid){          // 总课时 = 初始总课时 + 累计续费课时
  var s = findStu(sid); if (!s) return 0;
  return Math.round((s.total + renewalHoursOf(sid)) * 100) / 100;
}
function remainingOf(sid){
  return Math.round((totalHoursOf(sid) - consumedOf(sid)) * 100) / 100;
}
function findStu(sid){
  for (var i = 0; i < state.students.length; i++) if (state.students[i].id === sid) return state.students[i];
  return null;
}
function detailOf(sid){
  var out = [];
  for (var d in state.lessons) {
    var it = state.lessons[d].items[sid];
    if (it) out.push({ date: d, status: it.status, hours: it.hours, remark: it.remark, lremark: state.lessons[d].remark });
  }
  out.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  return out;
}
function datedLessons(){
  var out = [];
  for (var d in state.lessons) {
    var any = false;
    for (var k in state.lessons[d].items) { any = true; break; }
    if (any) out.push(state.lessons[d]);
  }
  out.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return out;
}
/* 待办：今天未点名 / 出勤未填课时的逾期记录 / 课时不足 */
function pendingRollcall(){
  var t = todayStr(), L = state.lessons[t], done = 0;
  if (L) { for (var i=0;i<state.students.length;i++) if (L.items[state.students[i].id] && L.items[state.students[i].id].status) done++; }
  return { total: state.students.length, done: done, left: state.students.length - done };
}
function pendingHours(){
  var t = todayStr(), out = [];
  for (var d in state.lessons) {
    for (var i = 0; i < state.students.length; i++) {
      var s = state.students[i], it = state.lessons[d].items[s.id];
      if (it && it.status === 'present' && (it.hours === null || it.hours === '')) {
        out.push({ date: d, sid: s.id, name: s.name, overdue: d < t });
      }
    }
  }
  out.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return out;
}
function lowStudents(){
  var out = [];
  for (var i=0;i<state.students.length;i++){
    var r = remainingOf(state.students[i].id);
    if (r <= 3) out.push({ sid: state.students[i].id, name: state.students[i].name, left: r });
  }
  return out;
}
/* 每周排课：1=周一 … 7=周日 */
function weekdayOf(dateStr){
  var d = parseYmd(dateStr).getDay();
  return d === 0 ? 7 : d;
}
function lessonsOfDay(w){
  var arr = state.schedule[String(w)] || [];
  return arr.slice().sort(function(a,b){ return a.start < b.start ? -1 : 1; });
}
function todaySchedule(){ return lessonsOfDay(weekdayOf(todayStr())); }
function ensureSchForm(){
  if (!state.schForm) state.schForm = { start: '09:00', end: '10:30', name: '', sids: [] };
  return state.schForm;
}
/* 课包到期：距到期日 ≤30 天（含已过期）的续费记录 */
function daysTo(dateStr){
  if (!dateStr) return null;
  var a = parseYmd(todayStr()).getTime(), b = parseYmd(dateStr).getTime();
  return Math.round((b - a) / 86400000);
}
function expiringPkgs(){
  var out = [];
  for (var i=0;i<state.renewals.length;i++){
    var r = state.renewals[i];
    if (!r.expire) continue;
    var d = daysTo(r.expire);
    if (d === null || d > 30) continue;
    var s = findStu(r.sid);
    out.push({ id: r.id, sid: r.sid, name: s ? s.name : '（学员已删除）',
      expire: r.expire, days: d, hours: r.hours, left: remainingOf(r.sid) });
  }
  out.sort(function(a,b){ return a.days - b.days; });
  return out;
}
/* 月度课消统计 */
function monthStat(m){
  var rows = [], idx = {}, total = 0, cnt = 0;
  for (var i=0;i<state.students.length;i++){
    var s = state.students[i];
    rows.push({ sid: s.id, name: s.name, present: 0, leave: 0, absent: 0, hours: 0 });
    idx[s.id] = rows[rows.length-1];
  }
  for (var d in state.lessons){
    if (d.slice(0,7) !== m) continue;
    var L = state.lessons[d], any = false;
    for (var sid in L.items){
      var it = L.items[sid];
      if (!it || !it.status) continue;
      any = true;
      var row = idx[sid];
      if (!row) continue;
      if (it.status === 'present') row.present++;
      else if (it.status === 'leave') row.leave++;
      else if (it.status === 'absent') row.absent++;
      if (typeof it.hours === 'number') { row.hours += it.hours; total += it.hours; }
    }
    if (any) cnt++;
  }
  var pc = 0, lc = 0, ac = 0;
  for (var i=0;i<rows.length;i++){
    rows[i].hours = Math.round(rows[i].hours * 100) / 100;
    pc += rows[i].present; lc += rows[i].leave; ac += rows[i].absent;
  }
  rows.sort(function(a,b){ return b.hours - a.hours; });
  total = Math.round(total * 100) / 100;
  return { month: m, lessons: cnt, hours: total, present: pc, leave: lc, absent: ac,
    rate: (pc + lc + ac) ? Math.round(pc / (pc + lc + ac) * 100) : 0,
    avg: rows.length ? Math.round(total / rows.length * 10) / 10 : 0, rows: rows };
}
function monthOptions(){
  var set = {}, t = todayStr().slice(0,7);
  set[t] = 1;
  for (var d in state.lessons) { var any = false; for (var k in state.lessons[d].items) { any = true; break; } if (any) set[d.slice(0,7)] = 1; }
  var arr = [];
  for (var m in set) arr.push(m);
  arr.sort(function(a,b){ return a < b ? 1 : -1; });
  return arr;
}
function totalRecords(){
  var n = state.students.length;
  for (var d in state.lessons) n += Object.keys(state.lessons[d].items).length;
  return n;
}

/* ============ 渲染层（互相之间不调用，统一由 refreshAll 调度） ============ */
function renderNotice(){
  var box = document.getElementById('notice');
  var html = '';
  if (state.seeded) {
    html += '<div class="notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>'
      + '<span>当前显示的是示例数据（4 名学员 + 3 次课 + 3 条续费 + 3 节排课），可直接修改或一键清空后录入真实数据。</span>'
      + '<button data-act="reset">清空示例</button></div>';
  }
  if (totalRecords() >= 30 && !state.noticeHidden) {
    html += '<div class="notice"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>'
      + '<span>数据已积累 ' + totalRecords() + ' 条，建议导出一份 JSON 备份保存。</span>'
      + '<button data-act="export">立即备份</button></div>';
  }
  box.innerHTML = html;
}

function renderToday(){
  document.getElementById('todayDate').textContent = cnDate(todayStr()) + ' · 周' + '日一二三四五六'.charAt(new Date().getDay());
  var box = document.getElementById('todayList');
  var html = '', pr = pendingRollcall(), ph = pendingHours(), low = lowStudents();

  var tsch = todaySchedule();
  if (tsch.length) {
    var ts = [];
    for (var i=0;i<Math.min(tsch.length,3);i++){
      ts.push(tsch[i].start + (tsch[i].name ? ' ' + tsch[i].name : '') + '（' + tsch[i].sids.length + ' 人）');
    }
    html += '<div class="titem">'
      + '<div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>'
      + '<div class="tx"><b>今天有 ' + tsch.length + ' 节课</b><em>' + esc(ts.join('、')) + (tsch.length>3 ? ' 等' : '') + '</em></div>'
      + '<button class="btn sm" data-act="goto" data-tab="schedule">看课表</button></div>';
  }
  if (ph.length) {
    var od = 0; for (var i=0;i<ph.length;i++) if (ph[i].overdue) od++;
    var names = [];
    for (var i=0;i<Math.min(ph.length,3);i++) names.push(ph[i].name + '(' + cnDate(ph[i].date) + ')');
    html += '<div class="titem od">'
      + '<div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg></div>'
      + '<div class="tx"><b>' + (od ? '有 ' + od + ' 条课时未录入（已逾期）' : '有 ' + ph.length + ' 条课时待录入')
      + '</b><em>' + esc(names.join('、')) + (ph.length>3 ? ' 等' : '') + '</em></div>'
      + '<button class="btn sm primary" data-act="goto" data-tab="hours" data-date="' + ph[0].date + '">去补录</button></div>';
  }
  if (pr.left > 0) {
    html += '<div class="titem">'
      + '<div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>'
      + '<div class="tx"><b>今天还没点名：' + pr.left + ' 名学员待确认</b><em>已点 ' + pr.done + '/' + pr.total + '，点名后在「课时」里填消耗</em></div>'
      + '<button class="btn sm" data-act="goto" data-tab="rollcall" data-date="' + todayStr() + '">去点名</button></div>';
  }
  if (low.length) {
    var ns = []; for (var i=0;i<low.length;i++) ns.push(low[i].name + ' 剩 ' + low[i].left + ' 课时');
    html += '<div class="titem od">'
      + '<div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 9v4M12 16h.01"/></svg></div>'
      + '<div class="tx"><b>课时不足预警：' + low.length + ' 人</b><em>' + esc(ns.join('、')) + '</em></div>'
      + '<button class="btn sm" data-act="goto" data-tab="query">查看</button></div>';
  }
  var exp = expiringPkgs();
  if (exp.length) {
    var ex = [], odn = 0;
    for (var i=0;i<Math.min(exp.length,3);i++){
      ex.push(exp[i].name + ' ' + (exp[i].days < 0 ? ('已过期 ' + (-exp[i].days) + ' 天') : ('还剩 ' + exp[i].days + ' 天')));
      if (exp[i].days < 0) odn++;
    }
    html += '<div class="titem' + (odn ? ' od' : '') + '">'
      + '<div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>'
      + '<div class="tx"><b>课包到期提醒：' + exp.length + ' 个课包' + (odn ? '（' + odn + ' 个已过期）' : ' 30 天内到期')
      + '</b><em>' + esc(ex.join('、')) + (exp.length>3 ? ' 等' : '') + '</em></div>'
      + '<button class="btn sm" data-act="goto" data-tab="renew">去续费</button></div>';
  }
  if (!html) {
    html = '<div class="empty">今天的处理事项都完成了，很好。</div>';
  }
  box.innerHTML = html;
}

function renderTabs(){
  var tabs = document.querySelectorAll('.tab');
  for (var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('on', tabs[i].dataset.tab === state.tab);
  }
  var ids = ['students','rollcall','hours','query','renew','report','schedule'];
  for (var j=0;j<ids.length;j++){
    document.getElementById('tab-' + ids[j]).style.display = (ids[j] === state.tab) ? '' : 'none';
  }
}

function renderStudents(){
  var el = document.getElementById('tab-students');
  var html = '<div class="card"><h3>'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8352a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>'
    + '添加学员</h3><p class="sub">姓名 + 初始总课时，添加后可在下方随时编辑</p>'
    + '<div class="row">'
    + '<div class="field grow"><label>学员姓名</label><input class="inp" id="newName" placeholder="如：林知墨" maxlength="20"></div>'
    + '<div class="field" style="width:130px"><label>初始总课时</label><input class="inp" id="newTotal" type="number" inputmode="decimal" min="0" step="0.5" placeholder="24"></div>'
    + '<div class="field grow"><label>备注（可选）</label><input class="inp" id="newNote" placeholder="如：楷书启蒙" maxlength="30"></div>'
    + '<div class="field"><label>&nbsp;</label><button class="btn primary" style="min-height:44px" data-act="addStu">添加学员</button></div>'
    + '</div></div>';

  html += '<div class="card"><h3>'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8352a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87"/></svg>'
    + '学员列表（' + state.students.length + ' 人）</h3><p class="sub">剩余课时由「初始总课时 − 已消耗课时」自动计算</p>';

  if (!state.students.length) {
    html += '<div class="empty">还没有学员，先在上面添加一位。</div>';
  } else {
    html += '<div class="grid">';
    for (var i=0;i<state.students.length;i++){
      var s = state.students[i], used = consumedOf(s.id), left = remainingOf(s.id);
      var pct = s.total > 0 ? Math.min(100, Math.max(0, used / s.total * 100)) : 0;

          + '<div class="kv"><div><b>' + totalHoursOf(s.id) + '</b><span>总课时</span></div>'
          + '<div><b class="c">' + used + '</b><span>已消耗</span></div>'
          + '<div><b class="r">' + left + '</b><span>剩余</span></div></div>'
          + '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
          + (left <= 3 ? '<div class="warn">剩余不足 4 课时，建议提醒续费</div>' : '');
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

function statusLabel(v){
  if (v === 'present') return '出勤';
  if (v === 'leave') return '请假';
  if (v === 'absent') return '缺勤';
  return '未点名';
}

/* 内联 SVG 柱状图（不引任何图表库） */
function barChartPairs(items){
  var W = 620, H = 170, pad = 26, n = items.length;
  if (!n) return '';
  var vals = [], i;
  for (i=0;i<n;i++) vals.push(items[i].value);
  var max = Math.max.apply(null, vals.concat([1]));
  var total = W - pad*2;
  var bw = Math.max(16, Math.min(56, Math.floor(total / n) - 16));
  var gap = n > 1 ? (total - bw*n) / (n - 1) : 8;
  if (gap < 4) gap = 4;
  if (bw*n + gap*(n-1) > total) bw = Math.max(14, Math.floor((total - gap*(n-1)) / n));
  var start = pad + Math.max(0, (total - (bw*n + gap*(n-1))) / 2);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="170" role="img" aria-label="消耗课时柱状图">';
  s += '<line x1="' + pad + '" y1="' + (H-34) + '" x2="' + (W-pad) + '" y2="' + (H-34) + '" stroke="#e9e2d7" stroke-width="1"/>';
  for (i=0;i<n;i++){
    var hgt = Math.max(3, (vals[i] / max) * 96);
    var x = start + i * (bw + gap);
    var y = H - 34 - hgt;
    var lb = String(items[i].label);
    if (lb.length > 5) lb = lb.slice(0,4) + '…';
    s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw + '" height="' + hgt.toFixed(1) + '" rx="6" fill="#a8352a" opacity="' + (0.55 + 0.45*(i+1)/n).toFixed(2) + '"/>';
    s += '<text x="' + (x + bw/2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-size="12" fill="#2f2a26" font-weight="700">' + vals[i] + '</text>';
    s += '<text x="' + (x + bw/2).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="' + (n > 8 ? 10 : 11) + '" fill="#6b6259">' + esc(lb) + '</text>';
  }
  s += '</svg>';
  return s;
}
function barChart(lessons){
  var items = [];
  for (var i=0;i<lessons.length;i++){
    var sum = 0;
    for (var k in lessons[i].items) { var h = lessons[i].items[k].hours; if (typeof h === 'number') sum += h; }
    items.push({ label: cnDate(lessons[i].date), value: Math.round(sum*100)/100 });
  }
  return barChartPairs(items);
}

function addStu(){
  var n = document.getElementById('newName');
  var t = document.getElementById('newTotal');
  var nt = document.getElementById('newNote');
  var name = (n.value || '').trim();
  if (!name) { alert('请填写学员姓名'); n.focus(); return; }
  var total = num(t.value);
  if (total === null) { alert('请填写初始总课时（数字，可为 0）'); t.focus(); return; }
  state.students.push({ id: uid(), name: name, total: total, note: (nt.value||'').trim(), created: todayStr() });
  n.value = ''; t.value = ''; nt.value = '';
  save(); refreshAll();
}
function delStu(id){
  var s = findStu(id); if (!s) return;
  if (!confirm('确定删除学员「' + s.name + '」吗？\n该学员的历史点名与课时记录也会一并删除，此操作不可恢复。')) return;
  state.students = state.students.filter(function(x){ return x.id !== id; });
  for (var d in state.lessons) { delete state.lessons[d].items[id]; }
  if (state.editId === id) state.editId = '';
  save(); refreshAll();
}
function setStatus(id, v){
  var r = getLesson(state.curDate).items[id];
  var cur = r ? r.status : '';
  if (cur === v) { v = ''; }              // 再点一次取消该状态
  setRec(state.curDate, id, { status: v });
  // 标记出勤时默认消耗 1 课时，老师可在「课时」页修改
  if (v === 'present' && getRec(state.curDate, id).hours === null) setRec(state.curDate, id, { hours: 1 });
  save(); refreshAll();
}
function addRenew(){
  var sid = state.renewSid;
  if (!sid || !findStu(sid)) { alert('请先选择学员'); return; }
  var h = num(document.getElementById('rnHours').value);
  if (h === null || h <= 0) { alert('请填写购买课时数（大于 0 的数字）'); return; }
  var amt = num(document.getElementById('rnAmount').value);
  state.renewals.push({
    id: uid(), sid: sid,
    date: document.getElementById('rnDate').value || todayStr(),
    hours: h, amount: (amt === null ? 0 : amt),
    expire: document.getElementById('rnExpire').value || '',
    note: (document.getElementById('rnNote').value || '').trim()
  });
  state.renewSid = '';
  save(); refreshAll();
}
function delRenew(id){
  var r = null;
  for (var i=0;i<state.renewals.length;i++) if (state.renewals[i].id === id) r = state.renewals[i];
  if (!r) return;
  var s = findStu(r.sid);
  if (!confirm('确定删除「' + (s ? s.name : '该学员') + '」这条 +' + r.hours + ' 课时的续费记录吗？\n删除后该学员的剩余课时会相应减少。')) return;
  state.renewals = state.renewals.filter(function(x){ return x.id !== id; });
  save(); refreshAll();
}
function addSch(){
  var f = ensureSchForm();
  var day = Number(state.schDay) || weekdayOf(todayStr());
  var start = (document.getElementById('schStart').value || '').trim();
  var end = (document.getElementById('schEnd').value || '').trim();
  var name = (document.getElementById('schName').value || '').trim();
  if (!start) { alert('请填写开始时间'); return; }
  if (end && end < start) { alert('结束时间不能早于开始时间'); return; }
  if (!f.sids.length) { alert('请至少选择一名上课学员'); return; }
  var key = String(day);
  if (!state.schedule[key]) state.schedule[key] = [];
  state.schedule[key].push({ id: uid(), start: start, end: end, name: name, sids: f.sids.slice() });
  f.sids = []; f.name = '';
  save(); refreshAll();
}
function delSch(id, day){
  var key = String(Number(day)), arr = state.schedule[key];
  if (!arr) return;
  var item = null;
  for (var i=0;i<arr.length;i++) if (arr[i].id === id) item = arr[i];
  if (!item) return;
  if (!confirm('确定删除周' + WD[Number(day)-1] + ' ' + item.start + (item.name ? ' ' + item.name : '') + ' 这节课吗？')) return;
  state.schedule[key] = arr.filter(function(x){ return x.id !== id; });
  save(); refreshAll();
}
function exportJson(){
  var data = { app: 'calligraphy-workbench', v: 3, exportedAt: new Date().toISOString(),
    students: state.students, lessons: state.lessons, renewals: state.renewals, schedule: state.schedule };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  download(blob, '书法工作台备份_' + todayStr() + '.json');
}
function exportCsv(month){
  var rows = [['日期','学员','出勤','消耗课时','学员备注','当日课程备注']];
  var ls = datedLessons();
  for (var i=0;i<ls.length;i++){
    if (month && ls[i].date.slice(0,7) !== month) continue;
    for (var j=0;j<state.students.length;j++){
      var s = state.students[j], it = ls[i].items[s.id];
      if (!it) continue;
      rows.push([ls[i].date, s.name, statusLabel(it.status),
        (it.hours === null || it.hours === '' ? '' : it.hours), it.remark || '', ls[i].remark || '']);
    }
  }
  var csv = rows.map(function(r){
    return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }),
    (month ? '课时明细_' + month : '课时明细_全部') + '.csv');
}
function backupText(){
  return JSON.stringify({ app: 'calligraphy-workbench', v: 3, exportedAt: new Date().toISOString(),
    students: state.students, lessons: state.lessons, renewals: state.renewals, schedule: state.schedule });
}
function copyBackup(){
  var txt = backupText();
  var done = function(){ alert('备份已复制。\n粘贴到微信收藏 / 备忘录 / 文件传输助手即可永久保存。'); };
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
    ta.style.width = '1px'; ta.style.height = '1px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done();
    else prompt('复制失败，请手动全选复制下面的备份内容：', txt);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else { fallback(); }
}
function pasteRestore(){
  var txt = prompt('把之前复制的备份内容粘贴到下面：');
  if (!txt) return;
  var d;
  try { d = JSON.parse(txt); } catch (e) { alert('内容不是有效的备份数据，请重新复制完整内容。'); return; }
  if (!d || !Array.isArray(d.students)) { alert('备份内容不完整，缺少学员数据。'); return; }
  if (!confirm('将恢复 ' + d.students.length + ' 名学员的数据，覆盖当前内容。确定吗？')) return;
  applyImport(d);
}
function download(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 300);
}
function applyImport(d){
  state.students = d.students;
  state.lessons = (d.lessons && typeof d.lessons === 'object') ? d.lessons : {};
  state.renewals = Array.isArray(d.renewals) ? d.renewals : [];
  state.schedule = (d.schedule && typeof d.schedule === 'object') ? d.schedule : {};
  state.seeded = false; state.editId = ''; state.openSid = ''; state.renewSid = '';
  state.schSid = ''; state.schForm = null; state.rptMonth = todayStr().slice(0,7);
  save(); refreshAll();
}
function doImport(file){
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.students)) throw new Error('格式不对');
      if (!confirm('导入将覆盖当前数据（学员 ' + d.students.length + ' 人）。建议先导出备份，确定继续吗？')) return;
      applyImport(d);
      alert('导入成功');
    } catch(e){ alert('导入失败：文件不是本工作台导出的 JSON 备份'); }
  };
  fr.readAsText(file);
}
function resetAll(){
  if (!confirm('确定清空全部数据吗？\n所有学员、点名、课时、续费与课表都会被删除，且无法恢复。')) return;
  if (!confirm('再确认一次：真的要清空吗？建议先点「导出备份」。')) return;
  state.students = []; state.lessons = {}; state.renewals = []; state.schedule = {}; state.seeded = false;
  state.editId = ''; state.openSid = ''; state.renewSid = ''; state.curDate = todayStr();
  state.rptMonth = todayStr().slice(0,7); state.schSid = ''; state.schForm = null;
  save(); refreshAll();
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === 'tab') { state.tab = el.dataset.tab; refreshAll(); return; }
  if (act === 'goto') { go(el.dataset.tab, el.dataset.date); return; }
  if (act === 'addStu') { addStu(); return; }
  if (act === 'editStu') { state.editId = id; refreshAll(); return; }
  if (act === 'cancelEdit') { state.editId = ''; refreshAll(); return; }
  if (act === 'saveStu') {
    var s = findStu(id); if (!s) return;
    var nm = (s.name || '').trim();
    if (!nm) { alert('姓名不能为空'); return; }
    s.name = nm; state.editId = ''; save(); refreshAll(); return;
  }
  if (act === 'delStu') { delStu(id); return; }
  if (act === 'addRenew') { addRenew(); return; }
  if (act === 'delRenew') { delRenew(id); return; }
  if (act === 'csvMonth') { exportCsv(state.rptMonth || todayStr().slice(0,7)); return; }
  if (act === 'qsub') { state.querySub = (el.dataset.v === 'report') ? 'report' : 'hours'; renderQuery(); return; }
  if (act === 'addSch') { addSch(); return; }
  if (act === 'delSch') { delSch(id, el.dataset.day); return; }
  if (act === 'toggleSchSid') {
    var ff = ensureSchForm(), k = ff.sids.indexOf(id);
    if (k >= 0) ff.sids.splice(k, 1); else ff.sids.push(id);
    refreshAll(); return;
  }
  if (act === 'pickSchStu') { state.schSid = (state.schSid === id) ? '' : id; refreshAll(); return; }
  if (act === 'closeSchStu') { state.schSid = ''; refreshAll(); return; }
  if (act === 'setStatus') { setStatus(id, v); return; }
  if (act === 'allPresent') {
    for (var i=0;i<state.students.length;i++){
      var sid = state.students[i].id;
      setRec(state.curDate, sid, { status: 'present' });
      if (getRec(state.curDate, sid).hours === null) setRec(state.curDate, sid, { hours: 1 });
    }
    save(); refreshAll(); return;
  }
  if (act === 'fillDefault') {
    var L = getLesson(state.curDate), n = 0;
    for (var i=0;i<state.students.length;i++){
      var r = L.items[state.students[i].id];
      if (r && r.status === 'present' && (r.hours === null || r.hours === '')) { r.hours = 1; n++; }
    }
    save(); refreshAll();
    if (n === 0) alert('当天出勤学员的课时都已填写过了');
    return;
  }
  if (act === 'today') { state.curDate = todayStr(); refreshAll(); return; }
  if (act === 'toggleS') { state.openSid = (state.openSid === id) ? '' : id; refreshAll(); return; }
  if (act === 'export') { exportJson(); return; }
  if (act === 'copy') { copyBackup(); return; }
  if (act === 'paste') { pasteRestore(); return; }
  if (act === 'csv') { exportCsv(); return; }
  if (act === 'import') { document.getElementById('fileIn').click(); return; }
  if (act === 'reset') { resetAll(); return; }
});

document.addEventListener('change', function(e){
  var el = e.target.closest('[data-chg]');
  if (!el) return;
  var f = el.dataset.chg;
  if (f === 'curDate') {
    if (!el.value) { el.value = todayStr(); return; }
    state.curDate = el.value; refreshAll(); return;
  }
  if (f === 'renewSid') { state.renewSid = el.value; return; }
  if (f === 'schDay') { state.schDay = Number(el.value); state.schSid = ''; refreshAll(); return; }
  if (f === 'schStart') { ensureSchForm().start = el.value; return; }
  if (f === 'schEnd') { ensureSchForm().end = el.value; return; }
  if (f === 'rptMonth') { if (el.value) { state.rptMonth = el.value; refreshAll(); } return; }
  if (f === 'hours') {
    var val = el.value === '' ? null : num(el.value);
    setRec(el.dataset.date, el.dataset.id, { hours: val });
    save(); refreshAll(); return;
  }
});

document.addEventListener('input', function(e){
  var el = e.target.closest('[data-inp]');
  if (!el) return;
  var f = el.dataset.inp, id = el.dataset.id, d = el.dataset.date;
  if (f === 'editName' || f === 'editNote') {
    var s = findStu(id); if (!s) return;
    if (f === 'editName') s.name = el.value; else s.note = el.value;
    save(); return;                       // 不重渲染，避免输入框失焦
  }
  if (f === 'editTotal') {
    var s2 = findStu(id); if (!s2) return;
    var n = num(el.value); if (n !== null) { s2.total = n; save(); }
    return;
  }
  if (f === 'lessonRemark') { getLesson(d).remark = el.value; save(); return; }
  if (f === 'schName') { ensureSchForm().name = el.value; return; }
  if (f === 'stuRemark') { setRec(d, id, { remark: el.value }); save(); return; }
  if (f === 'kw') {
    state.kw = el.value;
    renderQuery();                       // 只重渲染本模块，避免联动其它模块
    var nx = document.querySelector('[data-inp="kw"]');
    if (nx) { nx.focus(); nx.setSelectionRange(nx.value.length, nx.value.length); }
    return;
  }
});

document.getElementById('fileIn').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (f) doImport(f);
  e.target.value = '';
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && (e.target.id === 'newName' || e.target.id === 'newTotal' || e.target.id === 'newNote')) addStu();
});

/* ============ 初始化（固定顺序，一次性渲染） ============ */
document.addEventListener('DOMContentLoaded', function(){
  load();
  state.curDate = todayStr();
  state.rptMonth = todayStr().slice(0,7);
  state.schDay = weekdayOf(todayStr());
  state.tab = 'students';
  refreshAll();
});
</script>
</body>
</html>
